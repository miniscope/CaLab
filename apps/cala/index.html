<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cala</title>
    <meta name="color-scheme" content="light dark" />
    <script>
      /* Apply the stored theme choice (theme.ts in @calab/ui) before first paint. */
      try {
        var t = localStorage.getItem('calab-theme');
        if (t === 'light' || t === 'dark' || t === 'synthwave' || t === 'notebook')
          document.documentElement.setAttribute('data-theme', t);
        if (localStorage.getItem('cala-fun') === 'off')
          document.documentElement.setAttribute('data-fun', 'off');
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=optional"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
