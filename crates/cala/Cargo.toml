[package]
name = "calab-cala"
version = "0.1.0"
edition = "2021"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O", "--enable-bulk-memory", "--enable-nontrapping-float-to-int", "--enable-simd"]

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["jsbindings"]
# Explicit opt-in for target-only frozen keep-test evidence.
diagnostics = []
# Measurement only: stage timers of observe and of the visit phases
# (`src/timing.rs`); no result changes. Off in every shipped build.
timing = []
jsbindings = ["wasm-bindgen", "console_error_panic_hook"]
# Stub for now: the Python module only reports the crate version. It exists so
# the feature set mirrors crates/solver and the CI lint covers both surfaces.
pybindings = ["pyo3"]

[dependencies]
# FFTs for motion registration (same crates and versions as crates/solver).
# `wasm_simd` lets rustfft's planner pick its SIMD kernels in the `+simd128`
# browser build (.cargo/config.toml); the output is bit-identical.
realfft = "3"
rustfft = { version = "6", features = ["wasm_simd"] }
# Float32 GEMMs of the compression (has a wasm simd128 kernel).
matrixmultiply = "0.3"
# The run parameters (`src/params`): serde for the JSON they are stored
# and passed as, schemars for the JSON Schema generated from the structs.
# `preserve_order` keeps the fields in declaration order (the form order).
# The schema is built only by the generator example and the tests, so the
# release wasm keeps none of it.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = { version = "1", features = ["preserve_order"] }
# SHA-256 of the canonical params JSON: the run fingerprint (`params::engine`).
sha2 = { version = "0.10", default-features = false }
wasm-bindgen = { version = "0.2", optional = true }
console_error_panic_hook = { version = "0.1", optional = true }
# Same pyo3 pin and abi3 rationale as crates/solver/Cargo.toml.
pyo3 = { version = "0.30", features = ["extension-module", "abi3-py311"], optional = true }

[dev-dependencies]
# Property tests (tests/*_proptest.rs: fft, avi, motion, preprocess). `std` only,
# same as crates/solver.
proptest = { version = "1", default-features = false, features = ["std"] }

# Writes the checked-in params schema (`npm run gen:params`).
[[example]]
name = "params_schema"

# qc_eval's unit tests (GT frame alignment) run with `cargo test`.
[[example]]
name = "qc_eval"
test = true

[[example]]
name = "fpstats_bench"
required-features = ["timing"]

# Unit tests of the slow loop are numerically heavy: optimised test builds
# run them in seconds instead of minutes (debug assertions stay on).
[profile.test]
opt-level = 2

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[lints.rust]
# Items reached from only one binding surface look dead in a build with the
# other feature alone (same reasoning as crates/solver).
dead_code = "allow"
