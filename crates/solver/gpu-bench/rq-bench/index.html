<!doctype html>
<meta charset="utf-8" />
<title>RQ bench</title>
<pre id="log"></pre>
<script type="module">
// GPU microbenchmark of the rolling-quantile cursor walk (baseline.rs
// RollingQuantile::compute after the sort), one row per thread, on real
// chain-scoring rows dumped by `dump_rq_rows`. The dense ranks and sorted
// keys come precomputed (the per-row sort is NOT measured here).
const log = (s) => (document.getElementById('log').textContent += s + '\n');
const buf = await (await fetch('rq_rows.bin')).arrayBuffer();
const hdr = new DataView(buf);
const base = hdr.getUint32(0, true), n = hdr.getUint32(4, true), win = hdr.getUint32(8, true);
const rowBytes = n * 16;
const rowsAt = (r, k) => new Uint32Array(buf, 16 + r * rowBytes + k * n * 4, n);
const adapter = await navigator.gpu.requestAdapter();
const device = await adapter.requestDevice({
  requiredLimits: {
    maxStorageBufferBindingSize: adapter.limits.maxStorageBufferBindingSize,
    maxBufferSize: adapter.limits.maxBufferSize,
  },
});
const info = adapter.info ?? {};
log(`adapter ${info.vendor} ${info.architecture}; rows in file ${base}, n ${n}, window ${win}`);
const words = Math.ceil(n / 32);
const code = /* wgsl */ `
struct P { rows: u32, n: u32, win: u32, words: u32 };
@group(0) @binding(0) var<uniform> p: P;
@group(0) @binding(1) var<storage, read> rank: array<u32>;
@group(0) @binding(2) var<storage, read> skey: array<u32>;
@group(0) @binding(3) var<storage, read_write> bits: array<u32>;
@group(0) @binding(4) var<storage, read_write> outv: array<f32>;

fn next_above(b0: u32, c: u32) -> u32 {
  var w = c / 32u; let b = c % 32u;
  var word = select(bits[b0 + w] & (0xFFFFFFFFu << (b + 1u)), 0u, b == 31u);
  loop {
    if (word != 0u) { return w * 32u + countTrailingZeros(word); }
    w += 1u;
    if (w >= p.words) { return 0xFFFFFFFFu; }
    word = bits[b0 + w];
  }
}
fn prev_below(b0: u32, c: u32) -> u32 {
  var w = c / 32u; let b = c % 32u;
  var word = select(bits[b0 + w] & (0xFFFFFFFFu >> (32u - b)), 0u, b == 0u);
  loop {
    if (word != 0u) { return w * 32u + 31u - countLeadingZeros(word); }
    if (w == 0u) { return 0xFFFFFFFFu; }
    w -= 1u;
    word = bits[b0 + w];
  }
}
fn key_to_f32(key: u32) -> f32 {
  let b = select(~key, key & 0x7FFFFFFFu, (key & 0x80000000u) != 0u);
  return bitcast<f32>(b);
}
@compute @workgroup_size(64)
fn main(@builtin(global_invocation_id) gid: vec3<u32>) {
  let row = gid.x;
  if (row >= p.rows) { return; }
  let r0 = row * p.n;
  let b0 = row * p.words;
  for (var i = 0u; i < p.words; i++) { bits[b0 + i] = 0u; }
  var cursor = rank[r0];
  var below = 0u;
  bits[b0 + cursor / 32u] |= 1u << (cursor % 32u);
  outv[r0] = key_to_f32(skey[r0 + cursor]);
  for (var t = 1u; t < p.n; t++) {
    let r = rank[r0 + t];
    bits[b0 + r / 32u] |= 1u << (r % 32u);
    below += select(0u, 1u, r < cursor);
    if (t >= p.win) {
      let rl = rank[r0 + t - p.win];
      bits[b0 + rl / 32u] &= ~(1u << (rl % 32u));
      if (rl < cursor) { below -= 1u; }
      else if (rl == cursor) {
        let c = next_above(b0, cursor);
        if (c != 0xFFFFFFFFu) { cursor = c; } else { cursor = prev_below(b0, cursor); below -= 1u; }
      }
    }
    let ws = min(t + 1u, p.win);
    let k = min((2u * (ws - 1u) + 5u) / 10u, ws - 1u);
    while (below < k) { cursor = next_above(b0, cursor); below += 1u; }
    while (below > k) { cursor = prev_below(b0, cursor); below -= 1u; }
    outv[r0 + t] = key_to_f32(skey[r0 + cursor]);
  }
}`;
const module = device.createShaderModule({ code });
const info2 = await module.getCompilationInfo();
for (const m of info2.messages) log(`wgsl ${m.type}: ${m.message} @${m.lineNum}`);
const pipeline = device.createComputePipeline({ layout: 'auto', compute: { module, entryPoint: 'main' } });
const results = [];
for (const R of (new URLSearchParams(location.search).get('rows') ?? '256,1024,2048,4096').split(',').map(Number)) {
  const bytes = R * n * 4;
  if (bytes > adapter.limits.maxStorageBufferBindingSize) { log(`R=${R}: too large`); continue; }
  const mk = (size, usage) => device.createBuffer({ size, usage });
  const S = GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST;
  const rankB = mk(bytes, S), keyB = mk(bytes, S), bitsB = mk(R * words * 4, S);
  const outB = mk(bytes, GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_SRC);
  for (let r = 0; r < R; r++) {
    device.queue.writeBuffer(rankB, r * n * 4, rowsAt(r % base, 1));
    device.queue.writeBuffer(keyB, r * n * 4, rowsAt(r % base, 2));
  }
  const uni = mk(16, GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST);
  device.queue.writeBuffer(uni, 0, new Uint32Array([R, n, win, words]));
  const bg = device.createBindGroup({
    layout: pipeline.getBindGroupLayout(0),
    entries: [uni, rankB, keyB, bitsB, outB].map((b, i) => ({ binding: i, resource: { buffer: b } })),
  });
  await device.queue.onSubmittedWorkDone();
  const run = async () => {
    const enc = device.createCommandEncoder();
    const pass = enc.beginComputePass();
    pass.setPipeline(pipeline); pass.setBindGroup(0, bg);
    pass.dispatchWorkgroups(Math.ceil(R / 64));
    pass.end();
    device.queue.submit([enc.finish()]);
    const t0 = performance.now();
    await device.queue.onSubmittedWorkDone();
    return performance.now() - t0;
  };
  await run();
  const times = [];
  for (let i = 0; i < 3; i++) { const t0 = performance.now(); await run(); times.push(performance.now() - t0); }
  const ms = Math.min(...times);
  // Validate the first `base` rows bit-for-bit against the CPU baselines.
  const vrows = Math.min(R, base);
  const st = mk(vrows * n * 4, GPUBufferUsage.MAP_READ | GPUBufferUsage.COPY_DST);
  const enc = device.createCommandEncoder();
  enc.copyBufferToBuffer(outB, 0, st, 0, vrows * n * 4);
  device.queue.submit([enc.finish()]);
  await st.mapAsync(GPUMapMode.READ);
  const got = new Uint32Array(st.getMappedRange().slice(0));
  let mism = 0;
  for (let r = 0; r < vrows; r++) {
    const exp = rowsAt(r, 3);
    for (let t = 0; t < n; t++) if (got[r * n + t] !== exp[t]) mism++;
  }
  const nsPerSample = (ms * 1e6) / (R * n);
  const line = `R=${R}: ${ms.toFixed(1)} ms, ${(R * n / ms / 1e6).toFixed(2)} G samples/s, mismatches ${mism}`;
  log(line);
  results.push({ R, ms, gsps: (R * n) / ms / 1e6, mism, nsPerSample });
  for (const b of [rankB, keyB, bitsB, outB, uni, st]) b.destroy();
}
window.__result = { n, win, results };
log('done');
</script>
