name: Deploy to GitHub Pages

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Read-only by default; only the deploy job gets the Pages/OIDC grants.
permissions:
  contents: read

concurrency:
  group: 'pages'
  cancel-in-progress: true

# Third-party actions pinned to SHAs; see ci.yml header for the procedure
# to update a pin.

jobs:
  # Gate the deploy on the same suite that gates main (TS checks here; Rust,
  # Python and RLS in the jobs below). CI passing on `main` doesn't transfer
  # to a tag push — without these jobs a tag can deploy commits that would
  # fail CI.
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - run: npm ci

      # pkg/ is build-only/gitignored — build it before typecheck/test consume it.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable (2026-04-15)
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            crates/solver -> target
            crates/cala -> target

      - name: Install wasm-pack
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: wasm-pack@0.13.1

      - name: Build WASM
        run: npm run build:wasm

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: App test scripts
        run: npm run check:app-tests

      - name: Tests
        run: npm run test

  # The rust, python, supabase and e2e jobs below mirror ci.yml's jobs of the same
  # name, so a tag cannot deploy a commit that CI would reject. Keep them in
  # sync with ci.yml when either changes.
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/solver
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable (2026-04-15)
        with:
          components: clippy, rustfmt

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            crates/solver -> target
            crates/cala -> target

      - name: Format check
        run: cargo fmt --all --check

      # Lint each binding feature set separately. `--all-targets` includes the
      # test modules.
      - name: Clippy (jsbindings)
        run: cargo clippy --all-targets --no-default-features --features jsbindings -- -D warnings

      # The pyo3 path is otherwise only compiled by `maturin develop` in the
      # python job, which never runs clippy. Clippy type-checks every target
      # (so it also covers `cargo check`). `cargo test` can't link with
      # pybindings: pyo3's `extension-module` feature leaves libpython
      # unresolved, and pytest exercises that path at runtime anyway.
      - name: Clippy (pybindings)
        run: cargo clippy --all-targets --no-default-features --features pybindings -- -D warnings

      - name: Tests
        run: cargo test --no-default-features --features jsbindings

      # crates/cala (the streaming Miniscope pipeline): the same four checks,
      # in the same job so the `rust` check name is unchanged.
      - name: Cala - format check
        working-directory: crates/cala
        run: cargo fmt --all --check

      - name: Cala - clippy (jsbindings)
        working-directory: crates/cala
        run: cargo clippy --all-targets --no-default-features --features jsbindings -- -D warnings

      - name: Cala - clippy (pybindings)
        working-directory: crates/cala
        run: cargo clippy --all-targets --no-default-features --features pybindings -- -D warnings

      - name: Cala - tests
        working-directory: crates/cala
        run: cargo test --no-default-features --features jsbindings

  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable (2026-04-15)

      - name: Create venv and install deps
        run: |
          python -m venv .venv
          .venv/bin/pip install maturin[patchelf] numpy pydantic pytest h5py zarr ruff mypy
        working-directory: python

      - name: Build and install (dev)
        run: .venv/bin/maturin develop --features pybindings
        working-directory: python

      - name: Ruff
        run: .venv/bin/ruff check src/ tests/
        working-directory: python

      - name: Mypy
        run: .venv/bin/mypy src/
        working-directory: python

      # `-m "not integration"` skips tests that require Playwright + a live
      # browser (see pytest marker in pyproject.toml). Those run outside CI.
      - name: Pytest
        run: .venv/bin/pytest -m "not integration"
        working-directory: python

  supabase:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U test -d test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: test
      PGPASSWORD: test
      PGDATABASE: test
    steps:
      - uses: actions/checkout@v7

      - name: Install psql
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: Apply migrations and run RLS policy matrix
        run: ./scripts/test-rls.sh
        env:
          USE_DOCKER: ''

      - name: Install Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x

      - name: Deno tests (geo-session edge function)
        working-directory: supabase/functions/geo-session
        # --no-check skips type-checking of the transitive npm dep graph
        # (supabase-js pulls @types/node which requires nodeModulesDir).
        # The edge runtime doesn't type-check at deploy time either.
        run: deno test --no-check --allow-env --allow-net --lock=deno.lock index.test.ts

  # Browser smoke tests (e2e/): build the combined Pages site and load every
  # app in headless Chromium — WASM init, worker boot, demo data, first
  # render — failing on any console error. The unit tests mock all of that.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - run: npm ci

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable (2026-04-15)
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            crates/solver -> target
            crates/cala -> target

      - name: Install wasm-pack
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: wasm-pack@0.13.1

      - name: Build WASM
        run: npm run build:wasm

      # Production base path, Supabase env blanked (see e2e/build-site.mjs).
      - name: Build site
        run: npm run build:e2e

      # Browser binaries are cached by Playwright version; the OS packages
      # Chromium needs are installed every run (`--with-deps`), cache or not.
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Type check (e2e)
        run: npm run typecheck:e2e

      - name: Smoke tests
        run: npm run test:e2e

      - name: Upload Playwright report and traces
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore

  deploy:
    needs: [check, rust, python, supabase, e2e]
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable (2026-04-15)
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            crates/solver -> target
            crates/cala -> target

      - name: Install wasm-pack
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: wasm-pack@0.13.1

      - run: npm ci
      - run: npm run build:pages
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          # Data donation's own Supabase project. Both values are public (they ship
          # in the site's JavaScript); repo secrets of the same name override them.
          VITE_DONATION_SUPABASE_URL: ${{ secrets.DONATION_SUPABASE_URL || 'https://wdvqmppmevzqphcwobix.supabase.co' }}
          VITE_DONATION_SUPABASE_ANON_KEY: ${{ secrets.DONATION_SUPABASE_ANON_KEY || 'sb_publishable_Szs0UPItDRWn1XD_g1HSpA_17rCZUx-' }}
          VITE_DONATION_DANDISET: ${{ vars.DONATION_DANDISET || '' }}
          VITE_DONATION_DANDI_INSTANCE: ${{ vars.DONATION_DANDI_INSTANCE || 'dandi' }}
          VITE_APP_VERSION: ${{ github.ref_name }}

      - uses: actions/configure-pages@v6

      # combine-dist writes the site to dist/<repo name> (see scripts/lib/apps.mjs).
      - uses: actions/upload-pages-artifact@v5
        with:
          path: './dist/${{ github.event.repository.name }}'

      - id: deployment
        uses: actions/deploy-pages@v5

  # The same release on the lab's own server, https://calab.miniscope.org.
  # Caddy there serves /srv/calab/releases read-only: /<App>/v<version>/... from
  # v<version>/<App>/... and everything else from latest/, so every release
  # stays reachable at its versioned URL. This job uploads the combined site to
  # v<version>/ and then to latest/. It never deletes anything: the deploy key
  # is forced to `rrsync -wo -no-del /srv/calab/releases` on the server, and the
  # rsync calls below pass no --delete. See docs/CONTRIBUTING.md "Releases and
  # hosting".
  #
  # It builds the site separately from `deploy` (relative asset base, `npm run
  # build:site`) so the GitHub Pages build stays exactly as it was. Runs on `v*`
  # tag pushes only (python's `py/v*` tags don't match the trigger), never on a
  # manual run from a branch.
  deploy-vps:
    needs: [check, rust, python, supabase, e2e]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: 'calab-vps'
      cancel-in-progress: false
    env:
      DEPLOY_HOST: '172.233.157.81'
      DEPLOY_USER: 'calab-deploy'
    steps:
      - name: Check deploy secrets and release tag
        env:
          CALAB_DEPLOY_KEY: ${{ secrets.CALAB_DEPLOY_KEY }}
          CALAB_DEPLOY_KNOWN_HOSTS: ${{ secrets.CALAB_DEPLOY_KNOWN_HOSTS }}
          TAG: ${{ github.ref_name }}
        run: |
          fail=0
          if [ -z "$CALAB_DEPLOY_KEY" ]; then
            echo "::error::Secret CALAB_DEPLOY_KEY is not set; cannot deploy to calab.miniscope.org."
            fail=1
          fi
          if [ -z "$CALAB_DEPLOY_KNOWN_HOSTS" ]; then
            echo "::error::Secret CALAB_DEPLOY_KNOWN_HOSTS is not set; cannot deploy to calab.miniscope.org."
            fail=1
          fi
          # The folder name becomes part of the URL (/<App>/<tag>/), which the
          # server matches as v[0-9][^/]*.
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Tag '$TAG' is not a release version like v2.23.1."
            fail=1
          fi
          exit $fail

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable (2026-04-15)
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            crates/solver -> target
            crates/cala -> target

      - name: Install wasm-pack
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: wasm-pack@0.13.1

      - run: npm ci

      # Same environment as the Pages build; only the asset base differs.
      - run: npm run build:site
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          VITE_DONATION_SUPABASE_URL: ${{ secrets.DONATION_SUPABASE_URL || 'https://wdvqmppmevzqphcwobix.supabase.co' }}
          VITE_DONATION_SUPABASE_ANON_KEY: ${{ secrets.DONATION_SUPABASE_ANON_KEY || 'sb_publishable_Szs0UPItDRWn1XD_g1HSpA_17rCZUx-' }}
          VITE_DONATION_DANDISET: ${{ vars.DONATION_DANDISET || '' }}
          VITE_DONATION_DANDI_INSTANCE: ${{ vars.DONATION_DANDI_INSTANCE || 'dandi' }}
          VITE_APP_VERSION: ${{ github.ref_name }}

      # The site must not contain the Pages base: an absolute /CaLab/... URL
      # 404s on calab.miniscope.org. Every app page must load ./assets/.
      - name: Check the site uses relative asset paths
        run: |
          site="dist/${{ github.event.repository.name }}"
          if grep -rlE '"/CaLab/' "$site"; then
            echo "::error::The files above contain absolute /CaLab/ paths; the site was not built with a relative base."
            exit 1
          fi
          for page in "$site"/*/index.html; do
            if ! grep -q 'src="\./assets/' "$page"; then
              echo "::error::$page does not load ./assets/ (relative base missing)."
              exit 1
            fi
          done

      - name: Set up SSH
        env:
          CALAB_DEPLOY_KEY: ${{ secrets.CALAB_DEPLOY_KEY }}
          CALAB_DEPLOY_KNOWN_HOSTS: ${{ secrets.CALAB_DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$CALAB_DEPLOY_KEY" > ~/.ssh/calab_deploy
          chmod 600 ~/.ssh/calab_deploy
          printf '%s\n' "$CALAB_DEPLOY_KNOWN_HOSTS" > ~/.ssh/calab_known_hosts
          chmod 644 ~/.ssh/calab_known_hosts

      # Remote paths are relative to /srv/calab/releases (rrsync on the server).
      # v<version>/ first, so the versioned URLs work before latest/ changes;
      # then latest/ in two passes, everything but HTML and then the HTML, so a
      # visitor never gets a new index.html that points at assets not yet
      # uploaded. No --delete: old versions stay, and stale hashed assets in
      # latest/ are harmless.
      - name: Upload to calab.miniscope.org
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          site="dist/${{ github.event.repository.name }}"
          ssh_cmd="ssh -i $HOME/.ssh/calab_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/calab_known_hosts -o BatchMode=yes"
          dest="$DEPLOY_USER@$DEPLOY_HOST"

          # Assets-only copy of the site for the first latest/ pass.
          assets="$RUNNER_TEMP/site-assets"
          rm -rf "$assets"
          cp -R "$site" "$assets"
          find "$assets" -name '*.html' -type f -delete

          set -x
          rsync -rlz --checksum -e "$ssh_cmd" "$site/" "$dest:$VERSION/"
          rsync -rlz --checksum -e "$ssh_cmd" "$assets/" "$dest:latest/"
          rsync -rlz --checksum -e "$ssh_cmd" "$site/" "$dest:latest/"

      - name: Summary
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          {
            echo "### Deployed $VERSION to calab.miniscope.org"
            echo ""
            echo "- Latest: https://calab.miniscope.org/"
            echo "- This version: https://calab.miniscope.org/<App>/$VERSION/ (e.g. https://calab.miniscope.org/CaTune/$VERSION/)"
          } >> "$GITHUB_STEP_SUMMARY"
